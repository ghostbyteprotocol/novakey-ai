              fun getSuggestions(raw: String, lang: String): List<String> {
                  if (raw.isEmpty()) return emptyList()
                  if (lang == "EN") return listOf(raw)

                  val lower = raw.lowercase()
                  val results = LinkedHashSet<String>()

                  if (lang == "BN") {
                      bnDict[lower]?.let { results.addAll(it) }
                      results.add(transliterateBengali(lower))
                  } else if (lang == "HI") {
                      hiDict[lower]?.let { results.addAll(it) }
                      results.add(transliterateHindi(lower))
                  }

                  results.add(raw)
                  return results.toList()
              }

              private fun transliterateBengali(input: String): String {
                  val sb = StringBuilder()
                  var i = 0
                  var lastWasConsonant = false

                  val vowels = mapOf(
                      "o" to "অ", "a" to "আ", "i" to "ই", "ee" to "ঈ", "u" to "উ", "oo" to "ঊ",
                      "e" to "এ", "oi" to "ঐ", "ou" to "ঔ"
                  )
                  val matras = mapOf(
                      "a" to "া", "i" to "ি", "ee" to "ী", "u" to "ু", "oo" to "ূ",
                      "e" to "ে", "oi" to "ৈ", "o" to "ো", "ou" to "ৌ"
                  )
                  val consonants = mapOf(
                      "kh" to "খ", "gh" to "ঘ", "ng" to "ঙ",
                      "chh" to "ছ", "ch" to "চ", "jh" to "ঝ",
                      "th" to "থ", "dh" to "ধ", "ph" to "ফ", "bh" to "ভ", "sh" to "শ",
                      "k" to "ক", "g" to "গ", "c" to "চ", "j" to "জ",
                      "t" to "ত", "d" to "দ", "n" to "ন",
                      "p" to "প", "f" to "ফ", "b" to "ব", "v" to "ভ", "m" to "ম",
                      "y" to "য়", "r" to "র", "l" to "ল", "s" to "স", "h" to "হ"
                  )

                  while (i < input.length) {
                      var matched = false
                      if (i + 3 <= input.length) {
                          val sub3 = input.substring(i, i + 3)
                          if (consonants.containsKey(sub3)) {
                              sb.append(consonants[sub3])
                              lastWasConsonant = true
                              i += 3
                              matched = true
                          }
                      }
                      if (matched) continue

                      if (i + 2 <= input.length) {
                          val sub2 = input.substring(i, i + 2)
                          if (consonants.containsKey(sub2)) {
                              sb.append(consonants[sub2])
                              lastWasConsonant = true
                              i += 2
                              matched = true
                          } else if (lastWasConsonant && matras.containsKey(sub2)) {
                              sb.append(matras[sub2])
                              lastWasConsonant = false
                              i += 2
                              matched = true
                          } else if (!lastWasConsonant && vowels.containsKey(sub2)) {
                              sb.append(vowels[sub2])
                              lastWasConsonant = false
                              i += 2
                              matched = true
                          }
                      }
                      if (matched) continue

                      val sub1 = input.substring(i, i + 1)
                      if (consonants.containsKey(sub1)) {
                          sb.append(consonants[sub1])
                          lastWasConsonant = true
                      } else if (lastWasConsonant && matras.containsKey(sub1)) {
                          sb.append(matras[sub1])
                          lastWasConsonant = false
                      } else if (!lastWasConsonant && vowels.containsKey(sub1)) {
                          sb.append(vowels[sub1])
                          lastWasConsonant = false
                      } else {
                          sb.append(sub1)
                          lastWasConsonant = false
                      }
                      i++
                  }
                  return sb.toString()
              }

              private fun transliterateHindi(input: String): String {
                  val sb = StringBuilder()
                  var i = 0
                  var lastWasConsonant = false

                  val vowels = mapOf(
                      "a" to "अ", "aa" to "आ", "i" to "इ", "ee" to "ई", "u" to "उ", "oo" to "ऊ",
