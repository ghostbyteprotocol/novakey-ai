name: Build NovaKey APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/ghostbyte/novakey
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NovaKeyAI"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.ghostbyte.novakey'
              compileSdk 34

              defaultConfig {
                  applicationId "com.ghostbyte.novakey"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0-phase1"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:label="NovaKey AI"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".NovaKeyboardService"
                      android:label="NovaKey AI"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>

              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:settingsActivity="com.ghostbyte.novakey.MainActivity"
              android:supportsSwitchingToNextInputMethod="true" />
          EOF

          cat << 'EOF' > app/src/main/java/com/ghostbyte/novakey/MainActivity.kt
          package com.ghostbyte.novakey

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0B0F17"))
                      setPadding(54, 90, 54, 54)
                      gravity = Gravity.CENTER_HORIZONTAL
                  }

                  val title = TextView(this).apply {
                      text = "⚡ NovaKey AI"
                      textSize = 28f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#00E5FF"))
                      gravity = Gravity.CENTER
                  }

                  val subtitle = TextView(this).apply {
                      text = "Phase 1 • Offline Engine (EN • বাং • हिं)"
                      textSize = 14f
                      setTextColor(Color.parseColor("#8B949E"))
                      gravity = Gravity.CENTER
                      setPadding(0, 12, 0, 60)
                  }

                  val btnEnable = createStyledButton("1. Enable NovaKey in Settings", "#161B22", "#00E5FF").apply {
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS))
                      }
                  }

                  val btnSwitch = createStyledButton("2. Select NovaKey Keyboard", "#00E5FF", "#0B0F17").apply {
                      setOnClickListener {
                          val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                          imm.showInputMethodPicker()
                      }
                  }

                  val testLabel = TextView(this).apply {
                      text = "নিচে টাইপ করে টেস্ট কর (EN / বাং / हिं):"
                      textSize = 14f
                      setTextColor(Color.parseColor("#C9D1D9"))
                      setPadding(0, 60, 0, 18)
                  }

                  val testBox = EditText(this).apply {
                      hint = "এখানে লেখ... (যেমন: ami bhalo achi)"
                      setHintTextColor(Color.parseColor("#484F58"))
                      setTextColor(Color.WHITE)
                      textSize = 16f
                      minLines = 3
                      gravity = Gravity.TOP or Gravity.START
                      setPadding(36, 36, 36, 36)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#161B22"))
                          cornerRadius = 28f
                          setStroke(2, Color.parseColor("#30363D"))
                      }
                  }

                  root.addView(title)
                  root.addView(subtitle)
                  root.addView(btnEnable)
                  root.addView(btnSwitch)
                  root.addView(testLabel)
                  root.addView(testBox)

                  setContentView(root)
              }

              private fun createStyledButton(label: String, bgHex: String, textHex: String): Button {
                  return Button(this).apply {
                      text = label
                      textSize = 15f
                      isAllCaps = false
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor(textHex))
                      setPadding(32, 36, 32, 36)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor(bgHex))
                          cornerRadius = 28f
                          setStroke(2, Color.parseColor("#00E5FF"))
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          bottomMargin = 28
                      }
                  }
              }
          }
          EOF

