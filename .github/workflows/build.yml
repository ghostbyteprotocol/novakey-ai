                      "aa" to "ा", "a" to "ा", "i" to "ि", "ee" to "ी", "u" to "ु", "oo" to "ू",
                      "e" to "े", "ai" to "ै", "o" to "ो", "au" to "ौ"
                  )
                  val consonants = mapOf(
                      "kh" to "ख", "gh" to "घ", "chh" to "छ", "ch" to "च", "jh" to "झ",
                      "th" to "थ", "dh" to "ध", "ph" to "फ", "bh" to "भ", "sh" to "श",
                      "k" to "क", "g" to "ग", "j" to "ज", "t" to "त", "d" to "द", "n" to "न",
                      "p" to "प", "f" to "फ", "b" to "ब", "v" to "व", "m" to "म",
                      "y" to "य", "r" to "र", "l" to "ल", "s" to "स", "h" to "ह"
                  )

                  while (i < input.length) {
                      var matched = false
                      if (i + 3 <= input.length) {
                          val sub3 = input.substring(i, i + 3)
                          if (consonants.containsKey(sub3)) {
                              sb.append(consonants[sub3])
                              lastWasConsonant = true
                              i += 3
                              matched = true
                          }
                      }
                      if (matched) continue

                      if (i + 2 <= input.length) {
                          val sub2 = input.substring(i, i + 2)
                          if (consonants.containsKey(sub2)) {
                              sb.append(consonants[sub2])
                              lastWasConsonant = true
                              i += 2
                              matched = true
                          } else if (lastWasConsonant && matras.containsKey(sub2)) {
                              sb.append(matras[sub2])
                              lastWasConsonant = false
                              i += 2
                              matched = true
                          } else if (!lastWasConsonant && vowels.containsKey(sub2)) {
                              sb.append(vowels[sub2])
                              lastWasConsonant = false
                              i += 2
                              matched = true
                          }
                      }
                      if (matched) continue

                      val sub1 = input.substring(i, i + 1)
                      if (consonants.containsKey(sub1)) {
                          sb.append(consonants[sub1])
                          lastWasConsonant = true
                      } else if (lastWasConsonant && matras.containsKey(sub1)) {
                          sb.append(matras[sub1])
                          lastWasConsonant = false
                      } else if (!lastWasConsonant && vowels.containsKey(sub1)) {
                          sb.append(vowels[sub1])
                          lastWasConsonant = false
                      } else {
                          sb.append(sub1)
                          lastWasConsonant = false
                      }
                      i++
                  }
                  return sb.toString()
              }
          }
